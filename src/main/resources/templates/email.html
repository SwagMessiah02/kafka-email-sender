<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background-color:#f4f4f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:24px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <td style="padding:32px;">
                        <h1 style="margin:0 0 16px;font-size:24px;color:#222222;">
                            Olá, <span th:text="${nome}">Fulano</span>!
                        </h1>
                        <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#555555;">
                            Seu cadastro foi recebido com sucesso.
                        </p>
                        <a th:href="${link}" href="#"
                           style="display:inline-block;padding:12px 24px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:16px;">
                            Confirmar conta
                        </a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
