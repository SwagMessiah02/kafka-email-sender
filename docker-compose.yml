x-email-app: &email-app
  build: .
  environment:
    USERNAME:
    PASSWORD:
    KAFKA_PORT: 19092
    HOST: kafka-broker
    EMAIL_HOST:
    PORT:
services:
  email-app-1:
    <<: *email-app
    ports:
      - "8080:8080"
  email-app-2:
    <<: *email-app
    ports:
      - "8081:8080"
  email-app-3:
    <<: *email-app
    ports:
      - "8082:8080"
  broker:
    image: apache/kafka:4.4.0
    hostname: kafka-broker
    container_name: broker-kafka
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://:9092,CONTROLLER://:29093,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka-broker:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
